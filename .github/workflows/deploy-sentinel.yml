name: Deploy Sentinel

on:
  push:
    branches: [main]
    paths:
      - "sentinel/**"
      - "lib/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Using ./node_modules/.bin/tsup (local devDep) instead of `npx tsup`
      # because npx creates an isolated cache that can't see the repo's
      # local `typescript`, causing "Cannot find module 'typescript'".
      - name: Build sentinel worker
        run: ./node_modules/.bin/tsup sentinel/worker.ts --format cjs --out-dir sentinel/dist --external viem --external "@zerodev/*" --external "@neondatabase/*"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tapioca
            sudo -u tapioca git pull --ff-only origin main
            sudo -u tapioca CI=true pnpm install --frozen-lockfile
            sudo -u tapioca ./node_modules/.bin/tsup sentinel/worker.ts --format cjs --out-dir sentinel/dist --external viem --external "@zerodev/*" --external "@neondatabase/*"
            sudo -u tapioca CI=true pnpm -C sentinel/ponder install --frozen-lockfile
            sudo systemctl restart sentinel-worker
            sudo systemctl restart sentinel-ponder
            echo "Sentinel deployed successfully"
