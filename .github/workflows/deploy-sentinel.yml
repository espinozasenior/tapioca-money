name: Deploy Sentinel

on:
  push:
    branches: [main]
    paths:
      - "sentinel/**"
      - "lib/**"
      - ".github/workflows/deploy-sentinel.yml"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Using ./node_modules/.bin/tsup (local devDep) instead of `npx tsup`
      # because npx creates an isolated cache that can't see the repo's
      # local `typescript`, causing "Cannot find module 'typescript'".
      - name: Build sentinel worker
        run: ./node_modules/.bin/tsup sentinel/worker.ts --format cjs --out-dir sentinel/dist --external viem --external "@zerodev/*" --external "@neondatabase/*"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tapioca
            # Always deploy from origin/main — the VPS working tree is
            # fully managed by this workflow. Earlier manual deploys may
            # have left the repo on a feature branch with dirty files, so
            # we force-clean before switching back to main.
            sudo -u tapioca git fetch origin main
            sudo -u tapioca git checkout -f main
            sudo -u tapioca git reset --hard origin/main
            sudo -u tapioca git clean -fd
            sudo -u tapioca CI=true pnpm install --frozen-lockfile
            sudo -u tapioca ./node_modules/.bin/tsup sentinel/worker.ts --format cjs --out-dir sentinel/dist --external viem --external "@zerodev/*" --external "@neondatabase/*"
            sudo -u tapioca CI=true pnpm -C sentinel/ponder install --frozen-lockfile
            sudo systemctl restart sentinel-worker
            sudo systemctl restart sentinel-ponder
            echo "Sentinel deployed successfully"
